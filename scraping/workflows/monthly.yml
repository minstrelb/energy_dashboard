name: monthly-fuel

# 연료원별 전력거래량은 M+1월 말에 갱신된다(예: 8월분은 9월 말).
# 정확한 날짜를 모르므로 매달 1일과 15일 오전 9시(KST)에 확인하고, 바뀐 게 없으면 아무것도 하지 않는다.
on:
  schedule:
    - cron: "0 0 1,15 * *"   # 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 월별 연료원별 전력거래량 받기
        run: python scripts/fetch_monthly.py

      - name: 바뀐 데이터가 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "data: 월별 연료원별 전력거래량 갱신"
          git pull --rebase
          git push
